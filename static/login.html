<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Giriş · Evimiz</title><link rel="stylesheet" href="/style.css"><script type="module" src="/login.js"></script></head><body class="login-page"><main><article><a class="brand" href="/">⌂ evimiz.</a><h1 id="login-title">Giriş yap</h1><p id="login-note">Ev paneline hesabınla eriş.</p><form id="login-form"><label>Kullanıcı adı<input name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.-]+" required></label><label id="current-password-label" hidden>Mevcut parola<input type="password" name="currentPassword" autocomplete="current-password" maxlength="256"></label><label><span id="password-label">Parola</span><input type="password" name="password" autocomplete="current-password" maxlength="256" required></label><label class="consent" id="remember-label"><input type="checkbox" name="remember">Beni hatırla (30 gün)</label><button id="login-submit">Giriş yap</button><p role="status" id="login-error"></p></form></article></main></body></html>
